<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="dhInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
    </linearGradient>
    <filter id="dhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#38BDF8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- High-Contrast Squircle Foundation -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#dhGrad)" stroke="#020617" stroke-width="1.5"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.45"/>

  <!-- Center Obsidian Core -->
  <rect x="10" y="10" width="44" height="44" rx="12" fill="url(#dhInner)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Developer Terminal Prompt: >_ -->
  <path d="M21 24l8 8-8 8" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#dhGlow)"/>
  <line x1="33" y1="40" x2="43" y2="40" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round"/>

  <!-- High-Uptime Cloud Pulse Spark -->
